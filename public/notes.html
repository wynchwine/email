<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sommelier Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f9f6f1; color: #2c2c2c; min-height: 100vh; }

    #login {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-box {
      background: white; padding: 48px; border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08); width: 360px; text-align: center;
    }
    .login-box h1 { font-size: 22px; margin-bottom: 8px; }
    .login-box p { color: #888; font-size: 14px; margin-bottom: 28px; font-family: sans-serif; }
    .login-box input {
      width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 16px; margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: #8b4513; }
    .login-box button {
      width: 100%; padding: 12px; background: #8b4513; color: white;
      border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-family: Georgia, serif;
    }
    .login-box button:hover { background: #7a3b10; }
    .error { color: #c0392b; font-size: 13px; margin-top: 8px; font-family: sans-serif; }

    #app { display: none; max-width: 960px; margin: 0 auto; padding: 48px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    header h1 { font-size: 26px; }
    .logout { background: none; border: 1px solid #ddd; padding: 6px 14px; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-family: sans-serif; color: #555; }
    .logout:hover { background: #f0f0f0; }

    .card {
      background: white; border-radius: 8px; padding: 28px 32px;
      margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .card-meta { font-family: sans-serif; }
    .card-name { font-weight: 600; font-size: 16px; }
    .card-email { color: #888; font-size: 13px; margin-top: 2px; }
    .card-date { font-size: 12px; color: #aaa; font-family: sans-serif; text-align: right; }

    .section { margin-bottom: 20px; }
    .section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      font-family: sans-serif; margin-bottom: 10px; padding: 4px 10px; border-radius: 4px;
      display: inline-block;
    }
    .section-title.sommelier { background: #f3ede6; color: #8b4513; }
    .section-title.checkout { background: #eef3f9; color: #2c5f8a; }
    .section-wines { font-size: 13px; color: #8b4513; font-family: sans-serif; margin-bottom: 10px; }
    .section-wines.checkout { color: #2c5f8a; }
    .lang-block { margin-bottom: 12px; }
    .lang-label { font-size: 11px; font-weight: 700; color: #aaa; font-family: sans-serif; margin-bottom: 3px; letter-spacing: 1px; }
    .note-text { line-height: 1.7; font-size: 15px; color: #333; }
    .card-order { font-size: 11px; color: #ccc; font-family: sans-serif; margin-top: 12px; }
    .divider { border: none; border-top: 1px solid #f0ece8; margin: 20px 0; }

    .empty { text-align: center; color: #aaa; font-family: sans-serif; padding: 60px 0; }
    .stats { font-size: 13px; color: #888; font-family: sans-serif; display: flex; gap: 20px; }
    .stat { }
  </style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>Sommelier Notes</h1>
    <p>Enter password to view notes</p>
    <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Enter</button>
    <div class="error" id="error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Sommelier Notes</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <div class="stats" id="stats"></div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>
  <div id="notes"></div>
</div>

<script>
  async function login() {
    const password = document.getElementById('password').value;
    if (!password) return;
    document.getElementById('error').textContent = '';

    const res = await fetch('/api/notes', {
      headers: { Authorization: 'Bearer ' + password }
    });

    if (res.status === 401) {
      document.getElementById('error').textContent = 'Wrong password';
      return;
    }

    sessionStorage.setItem('notes_pwd', password);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderNotes(await res.json());
  }

  function renderNotes(notes) {
    const container = document.getElementById('notes');
    const sommelierCount = notes.filter(n => n.sommelier).length;
    const checkoutCount = notes.filter(n => n.checkout).length;
    document.getElementById('stats').innerHTML =
      `<span class="stat">${notes.length} profiles</span>` +
      `<span class="stat">🍷 ${sommelierCount} order notes</span>` +
      `<span class="stat">🛒 ${checkoutCount} checkout notes</span>`;

    if (!notes.length) {
      container.innerHTML = '<div class="empty">No notes yet</div>';
      return;
    }

    container.innerHTML = notes.map(n => {
      const date = n.sommelier?.updated_at || n.checkout?.updated_at;
      let sections = '';

      if (n.sommelier) {
        sections += `
          <div class="section">
            <div><span class="section-title sommelier">🍷 Order Note</span></div>
            <div class="section-wines">🍷 ${esc(n.sommelier.wine || '—')}</div>
            ${n.sommelier.note_en ? `<div class="lang-block"><div class="lang-label">EN</div><div class="note-text">${esc(n.sommelier.note_en)}</div></div>` : ''}
            ${n.sommelier.note_de ? `<div class="lang-block"><div class="lang-label">DE</div><div class="note-text">${esc(n.sommelier.note_de)}</div></div>` : ''}
            <div class="card-order">Order #${esc(n.sommelier.order || '—')}</div>
          </div>`;
      }

      if (n.sommelier && n.checkout) sections += '<hr class="divider">';

      if (n.checkout) {
        sections += `
          <div class="section">
            <div><span class="section-title checkout">🛒 Abandoned Checkout</span></div>
            <div class="section-wines checkout">🛒 ${esc(n.checkout.wines || '—')}</div>
            ${n.checkout.note_en ? `<div class="lang-block"><div class="lang-label">EN</div><div class="note-text">${esc(n.checkout.note_en)}</div></div>` : ''}
            ${n.checkout.note_de ? `<div class="lang-block"><div class="lang-label">DE</div><div class="note-text">${esc(n.checkout.note_de)}</div></div>` : ''}
          </div>`;
      }

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-meta">
              <div class="card-name">${esc(n.name || '—')}</div>
              <div class="card-email">${esc(n.email)}</div>
            </div>
            <div class="card-date">${date ? new Date(date).toLocaleDateString('de-DE') : ''}</div>
          </div>
          ${sections}
        </div>`;
    }).join('');
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function logout() {
    sessionStorage.removeItem('notes_pwd');
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('password').value = '';
  }

  const saved = sessionStorage.getItem('notes_pwd');
  if (saved) {
    document.getElementById('password').value = saved;
    login();
  }
</script>
</body>
</html>
