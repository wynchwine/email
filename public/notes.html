<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sommelier Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f9f6f1; color: #2c2c2c; min-height: 100vh; }

    #login {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-box {
      background: white; padding: 48px; border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08); width: 360px; text-align: center;
    }
    .login-box h1 { font-size: 22px; margin-bottom: 8px; }
    .login-box p { color: #888; font-size: 14px; margin-bottom: 28px; font-family: sans-serif; }
    .login-box input {
      width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 16px; margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: #8b4513; }
    .login-box button {
      width: 100%; padding: 12px; background: #8b4513; color: white;
      border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-family: Georgia, serif;
    }
    .login-box button:hover { background: #7a3b10; }
    .error { color: #c0392b; font-size: 13px; margin-top: 8px; font-family: sans-serif; }

    #app { display: none; max-width: 900px; margin: 0 auto; padding: 48px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    header h1 { font-size: 26px; }
    header span { font-size: 13px; color: #888; font-family: sans-serif; }
    .logout { background: none; border: 1px solid #ddd; padding: 6px 14px; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-family: sans-serif; color: #555; }
    .logout:hover { background: #f0f0f0; }

    .card {
      background: white; border-radius: 8px; padding: 28px 32px;
      margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .card-meta { font-family: sans-serif; }
    .card-name { font-weight: 600; font-size: 16px; }
    .card-email { color: #888; font-size: 13px; margin-top: 2px; }
    .card-date { font-size: 12px; color: #aaa; font-family: sans-serif; text-align: right; }
    .card-wine { font-size: 13px; color: #8b4513; font-family: sans-serif; margin-bottom: 12px; }
    .card-note { line-height: 1.7; font-size: 15px; color: #333; }
    .card-lang { font-size: 11px; font-weight: 700; color: #8b4513; font-family: sans-serif; margin-bottom: 4px; letter-spacing: 1px; }
    .card-order { font-size: 11px; color: #ccc; font-family: sans-serif; margin-top: 12px; }

    .empty { text-align: center; color: #aaa; font-family: sans-serif; padding: 60px 0; }
    .loading { text-align: center; color: #aaa; font-family: sans-serif; padding: 60px 0; }
  </style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>Sommelier Notes</h1>
    <p>Enter password to view notes</p>
    <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Enter</button>
    <div class="error" id="error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Sommelier Notes</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span id="count"></span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>
  <div id="notes"></div>
</div>

<script>
  let password = '';

  async function login() {
    password = document.getElementById('password').value;
    if (!password) return;
    document.getElementById('error').textContent = '';
    document.getElementById('notes').innerHTML = '';

    const res = await fetch('/api/notes', {
      headers: { Authorization: 'Bearer ' + password }
    });

    if (res.status === 401) {
      document.getElementById('error').textContent = 'Wrong password';
      return;
    }

    sessionStorage.setItem('notes_pwd', password);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderNotes(await res.json());
  }

  function renderNotes(notes) {
    const container = document.getElementById('notes');
    document.getElementById('count').textContent = notes.length + ' notes';

    if (!notes.length) {
      container.innerHTML = '<div class="empty">No sommelier notes yet</div>';
      return;
    }

    container.innerHTML = notes.map(n => `
      <div class="card">
        <div class="card-header">
          <div class="card-meta">
            <div class="card-name">${esc(n.name || '—')}</div>
            <div class="card-email">${esc(n.email)}</div>
          </div>
          <div class="card-date">${n.updated_at ? new Date(n.updated_at).toLocaleDateString('de-DE') : ''}</div>
        </div>
        <div class="card-wine">🍷 ${esc(n.wine || '—')}</div>
        ${n.note_en ? `<div class="card-lang">EN</div><div class="card-note">${esc(n.note_en)}</div>` : ''}
        ${n.note_de ? `<div class="card-lang" style="margin-top:12px">DE</div><div class="card-note">${esc(n.note_de)}</div>` : ''}
        <div class="card-order">Order #${esc(n.order || '—')}</div>
      </div>
    `).join('');
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function logout() {
    sessionStorage.removeItem('notes_pwd');
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('password').value = '';
  }

  // auto-login if password saved
  const saved = sessionStorage.getItem('notes_pwd');
  if (saved) {
    document.getElementById('password').value = saved;
    login();
  }
</script>
</body>
</html>
