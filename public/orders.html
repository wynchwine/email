<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>WYNCH — Orders</title>
  <style>
    :root {
      --accent: #ff6315;
      --bg: #eeece7;
      --card: #ffffff;
      --text: #3f3f41;
      --muted: #8a8a8a;
      --line: #e2ded6;
      --font: "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; padding: 24px; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    h1 { font-size: 24px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
    .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filters label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .filters input[type="date"], .filters select { font-family: var(--font); font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #fff; }
    .refresh { font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .refresh:hover { border-color: var(--accent); color: var(--accent); }

    .gate { max-width: 360px; margin: 60px auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; text-align: center; }
    .gate h2 { font-size: 18px; margin-bottom: 6px; }
    .gate p { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
    .gate input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9999px; font-size: 15px; outline: none; margin-bottom: 12px; }
    .gate input:focus { border-color: var(--accent); }
    .gate button { width: 100%; padding: 12px; border: none; border-radius: 9999px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
    .gate .err { color: #c0392b; font-size: 13px; min-height: 18px; margin-bottom: 8px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 26px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
    .card .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1.1; margin-top: 6px; }

    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .panel h3 { font-size: 15px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    tr:last-child td { border-bottom: none; }
    th.grp, td.grp { border-left: 2px solid var(--line); }
    th.grp { color: var(--accent); }
    .pill { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 9999px; }
    .pill.paid { background: rgba(255,99,21,0.12); color: var(--accent); }
    .pill.other { background: #eee; color: #888; }
    .muted { color: var(--muted); }
    .msg { padding: 40px; text-align: center; color: var(--muted); }
    .err-box { background: #fdecea; color: #c0392b; border-radius: 10px; padding: 14px 16px; font-size: 14px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="gate" id="gate" hidden>
      <h2>WYNCH — Заказы</h2>
      <p>Введите токен доступа</p>
      <div class="err" id="gateErr"></div>
      <input type="password" id="tokenInput" placeholder="Токен" autocomplete="off">
      <button id="gateBtn" type="button">Войти</button>
    </div>

    <div id="app" hidden>
      <header>
        <h1>Заказы · UTM</h1>
        <div class="filters">
          <label>UTM source <select id="sourceFilter"><option value="">Все</option></select></label>
          <label>С <input type="date" id="dateFrom"></label>
          <label>По <input type="date" id="dateTo"></label>
          <button class="refresh" id="dateClear" type="button">Сбросить</button>
          <button class="refresh" id="refreshBtn" type="button">Обновить</button>
        </div>
      </header>
      <div id="errBox"></div>
      <div class="cards" id="cards"></div>
      <div class="panel">
        <h3>Последние заказы</h3>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Заказ</th><th>Дата</th><th>Email</th><th>Сумма</th><th>Оплата</th><th>Выполнение</th>
                <th class="grp">UTM source</th><th>UTM medium</th><th>UTM campaign</th><th>UTM term</th><th>UTM content</th>
                <th class="grp">Источник</th><th>Реферер</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    var gate = document.getElementById('gate');
    var app = document.getElementById('app');
    var LS_KEY = 'wynch_orders_token';
    var lastData = null;

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function u(v, grp) { return '<td class="muted' + (grp ? ' grp' : '') + '">' + (v ? esc(v) : '—') + '</td>'; }
    function fmtDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
             ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function showGate(msg) {
      app.hidden = true; gate.hidden = false;
      document.getElementById('gateErr').textContent = msg || '';
      document.getElementById('tokenInput').focus();
    }

    function populateSourceOptions(all) {
      var sel = document.getElementById('sourceFilter');
      if (!sel) return;
      var cur = sel.value, set = {}, hasNone = false;
      all.forEach(function (o) { var s = (o.utm && o.utm.source) || ''; if (s) set[s] = true; else hasNone = true; });
      var html = '<option value="">Все</option>';
      Object.keys(set).sort().forEach(function (s) { html += '<option value="' + esc(s) + '">' + esc(s) + '</option>'; });
      if (hasNone) html += '<option value="__none__">— без UTM</option>';
      sel.innerHTML = html;
      if (cur && (cur === '__none__' || set[cur])) sel.value = cur;
    }

    function render(data) {
      lastData = data;
      gate.hidden = true; app.hidden = false;
      var errBox = document.getElementById('errBox');
      errBox.innerHTML = '';
      if (data.error) { errBox.innerHTML = '<div class="err-box">' + esc(data.error) + (data.detail ? ' — ' + esc(data.detail) : '') + '</div>'; }

      var all = data.orders || [];
      populateSourceOptions(all);

      var rows = all.slice();
      var srcSel = document.getElementById('sourceFilter');
      var srcVal = srcSel ? srcSel.value : '';
      if (srcVal) rows = rows.filter(function (o) { var s = (o.utm && o.utm.source) || ''; return srcVal === '__none__' ? !s : (s === srcVal); });

      var from = document.getElementById('dateFrom').value;
      var to = document.getElementById('dateTo').value;
      if (from) rows = rows.filter(function (o) { return o.date && o.date.slice(0, 10) >= from; });
      if (to) rows = rows.filter(function (o) { return o.date && o.date.slice(0, 10) <= to; });

      var revenue = 0, withUtm = 0;
      rows.forEach(function (o) {
        revenue += (Number(o.total) || 0);
        var utm = o.utm || {};
        if (utm.source || utm.medium || utm.campaign || utm.term || utm.content) withUtm++;
      });
      function card(l, v) { return '<div class="card"><div class="label">' + l + '</div><div class="value">' + v + '</div></div>'; }
      var pct = rows.length ? Math.round(withUtm / rows.length * 100) + '%' : '—';
      document.getElementById('cards').innerHTML =
        card('Всего заказов', rows.length) +
        card('Сумма', '€' + revenue.toFixed(2)) +
        card('С UTM', withUtm) +
        card('% с UTM', pct);

      var tbody = document.getElementById('tbody');
      if (!rows.length) { tbody.innerHTML = '<tr><td colspan="13" class="msg">Нет заказов</td></tr>'; return; }
      tbody.innerHTML = rows.map(function (o) {
        var utm = o.utm || {};
        var paid = /paid/i.test(o.financial_status || '');
        var total = (o.total != null) ? ('€' + Number(o.total).toFixed(2)) : '—';
        return '<tr>' +
          '<td>' + esc(o.order) + '</td>' +
          '<td class="muted">' + esc(fmtDate(o.date)) + '</td>' +
          '<td>' + esc(o.email) + '</td>' +
          '<td>' + esc(total) + '</td>' +
          '<td>' + (o.financial_status ? '<span class="pill ' + (paid ? 'paid' : 'other') + '">' + esc(o.financial_status) + '</span>' : '<span class="muted">—</span>') + '</td>' +
          '<td class="muted">' + (o.fulfillment_status ? esc(o.fulfillment_status) : '—') + '</td>' +
          u(utm.source, true) + u(utm.medium) + u(utm.campaign) + u(utm.term) + u(utm.content) +
          u(o.source_name, true) + u(o.referrer) +
          '</tr>';
      }).join('');
    }

    function load(token) {
      fetch('/api/orders?key=' + encodeURIComponent(token))
        .then(function (r) {
          if (r.status === 401) { localStorage.removeItem(LS_KEY); showGate('Неверный токен'); return null; }
          return r.json();
        })
        .then(function (data) {
          if (!data) return;
          localStorage.setItem(LS_KEY, token);
          render(data);
        })
        .catch(function () { showGate('Ошибка сети. Попробуйте ещё раз.'); });
    }

    function reRender() { if (lastData) render(lastData); }
    document.getElementById('dateFrom').addEventListener('change', reRender);
    document.getElementById('dateTo').addEventListener('change', reRender);
    document.getElementById('sourceFilter').addEventListener('change', reRender);
    document.getElementById('dateClear').addEventListener('click', function () {
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      document.getElementById('sourceFilter').value = '';
      reRender();
    });
    document.getElementById('refreshBtn').addEventListener('click', function () {
      var t = localStorage.getItem(LS_KEY); if (t) load(t); else showGate();
    });
    document.getElementById('gateBtn').addEventListener('click', function () {
      var t = document.getElementById('tokenInput').value.trim(); if (t) load(t);
    });
    document.getElementById('tokenInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('gateBtn').click();
    });

    (function () {
      var url = new URLSearchParams(location.search);
      var fromUrl = url.get('key');
      var saved = localStorage.getItem(LS_KEY);
      if (fromUrl) load(fromUrl);
      else if (saved) load(saved);
      else showGate();
    })();
  </script>
</body>
</html>
