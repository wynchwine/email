<!--
  WYNCH — wine card for blog articles.

  EASIEST: don't use this HTML at all. Just write a token on its own line in
  the article body and it renders a full card (bottle, aromas around it, name,
  price, add-to-cart) pulled from the Shopify product:

      [[wine:product-handle]]

  Aromas come from the product's secondary::aroma::<name> tags (images
  aroma__<name>.png in Files); region from secondary::region::<name>.

  ---------------------------------------------------------------------------
  MANUAL (only if you need a custom card): paste this into the body's HTML (<>)
  view and fill in the placeholders. Aroma images are optional — add up to 6
  <li> items; they position themselves around the bottle.
-->

<div class="wine-card">
  <a class="wine-card__stage" href="/products/PRODUCT-HANDLE">
    <ul class="wine-card__aromas">
      <li><img src="AROMA-IMAGE-URL-1" alt=""></li>
      <li><img src="AROMA-IMAGE-URL-2" alt=""></li>
    </ul>
    <img class="wine-card__bottle" src="BOTTLE-IMAGE-URL" alt="WEINNAME">
  </a>
  <h3 class="wine-card__title"><a href="/products/PRODUCT-HANDLE">WEINNAME &middot; REGION</a></h3>
  <div class="wine-card__price">&euro;19,00</div>
  <a class="wine-card__btn" href="/products/PRODUCT-HANDLE">In den Warenkorb</a>
</div>
